e);padding:12px 0}.rankrow span:nth-child(2){flex:1;overflow-wrap:anywhere}.score{font:700 88px system-ui;color:var(--cyan);line-height:1.2;margin:20px 0}.score small{font-size:24px;color:var(--muted)}.center{text-align:center}.review{margin:20px 0}.review summary{cursor:pointer;font-weight:700}dialog{color:white;background:#0c1328;border:1px solid #5bcadd;border-radius:20px;max-width:720px;width:calc(100% - 28px);max-height:85vh;padding:24px}dialog::backdrop{background:#000b;backdrop-filter:blur(6px)}.dialog-head{display:flex;justify-content:space-between;align-items:center}.law{border-top:1px solid var(--line);padding:20px 0}#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:#7c2035;padding:12px 24px;border-radius:12px;display:none;max-width:90vw}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}.room{margin-bottom:20px}.room-code{font:700 32px system-ui;color:var(--cyan);letter-spacing:4px}footer{font-size:14px;color:var(--muted);margin:24px 0}.stat{color:var(--cyan);font-weight:700}.timer{font-variant-numeric:tabular-nums}.step-label{font-size:14px;color:var(--cyan);margin:24px 0 12px}.wait{max-width:650px;margin:60px auto}.inline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.inline select{width:auto}.pill{font-size:13px;letter-spacing:1px}.recovery{margin-top:20px}.recovery summary{cursor:pointer}@media(max-width:760px){header{padding:16px;gap:8px;flex-wrap:wrap}.brand{width:100%}.start{grid-template-columns:1fr;padding:30px 20px;gap:28px}.start h1{font-size:40px}.layout{grid-template-columns:1fr}.panel{padding:22px}.workspace{padding:0 16px}.topline{align-items:flex-start;flex-wrap:wrap}.scenario{font-size:18px}.start .intro{max-width:550px}button{min-height:44px}.score{font-size:70px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function renderTopBar(){return `<div class="topline"><div><span class="eyebrow">${esc(game.nickname)}</span><div>${esc(game.student)} · <span class="stat">${game.done?game.xp:game.xp-game.score*100} XP</span></div></div><div class="inline"><span id="timer" class="timer"></span><button id="card-button">▤ การ์ดกฎหมาย</button></div></div>`}
function render(){if(!game)return start();if(E.expire(game))save();if(game.done)return finish();const q=feedback?.advance?shown:questions[game.index];shown=q;
app.innerHTML=`<section class="workspace">${renderTopBar()}<div class="progress"><div style="width:${game.index/questions.length*100}%"></div></div><div class="layout"><article class="panel"><div class="topline"><span class="eyebrow">${esc(q.phase)} / ${questions.indexOf(q)+1} OF 15</span><span class="role">${esc(q.role)}</span></div><h2>${esc(q.title)}</h2><p class="scenario">${esc(q.story)}</p>${q.phase==='นิยาม'?'<p class="small muted">เปิดการ์ด 01 อ่านนิยามมาตรา 4 ก่อนตอบได้ ตอบถูกทั้งสองขั้นจึงผ่าน</p>':''}${q.phase==='ประเมิน'?'<p class="small muted">ข้อละ 2 คะแนน บันทึกครั้งแรกที่กดส่ง แก้ไขไม่ได้ และเฉลยหลังส่งครบหรือหมดเวลา</p>':''}<div class="step-label">01 / คุณจะตัดสินใจอย่างไร?</div><div class="options">${options(q.actions,'action',q)}</div><div class="step-label">02 / หลักกฎหมายใดสนับสนุน?</div><div class="options">${options(q.reasons,'reason',q)}</div><div class="actions"><button class="primary" id="answer" ${selected.action===undefined||selected.reason===undefined||feedback?.advance?'disabled':''}>${q.phase==='ประเมิน'?'ยืนยันและบันทึกคำตอบ':'ตรวจคำตอบ'} →</button></div>${feedback?`<div class="feedback ${feedback.advance?'':'bad'}" role="status"><strong>การตัดสินใจ ${feedback.actionCorrect?'✓ ถูก':'ยังไม่ถูก'} · เหตุผล ${feedback.reasonCorrect?'✓ ถูก':'ยังไม่ถูก'}</strong><p>${esc(feedback.why)}</p><p class="small muted">${esc(cards[feedback.card].law)}</p>${feedback.advance?'<button class="primary" id="next">ภารกิจถัดไป →</button>':'<p>ลองเลือกใหม่ แล้วตรวจคำตอบอีกครั้งได้</p>'}</div>`:''}</article>${sidebar()}</div><footer>เนื้อหาอ้างอิงเอกสารในชั้นเรียน ไม่ใช่การยืนยันสถานะกฎหมายปัจจุบัน</footer></section>`;
document.querySelectorAll('[data-option]').forEach(el=>el.onclick=()=>{if(feedback?.advance)return;selected[el.dataset.kind]=Number(el.dataset.option);render()});bind('answer',()=>{try{const result=E.answer(game,q.id,selected.action,selected.reason);save();if(q.phase==='ประเมิน'){feedback=null;selected={}}else feedback=result;render()}catch(e){notice(e.message);render()}});bind('next',()=>{feedback=null;selected={};render()});bindCards();tick()}
function options(list,kind,q){return list.map((text,id)=>({text,id,order:hash(game.student+q.id+kind+id)})).sort((a,b)=>a.order-b.order).map((o,i)=>`<button class="option ${selected[kind]===o.id?'selected':''}" data-kind="${kind}" data-option="${o.id}" aria-pressed="${selected[kind]===o.id}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.text)}</span></button>`).join('')}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function bindCards(){bind('card-button',openCards);bind('card-side',openCards)}
function finish(){app.innerHTML=`<section class="workspace">${renderTopBar()}<div class="layout"><article class="panel"><div class="eyebrow">MISSION COMPLETE</div><h2>${game.index===15?'จบภารกิจแล้ว':'หมดเวลาแล้ว'}</h2><div class="score">${game.score}<small> / 10</small></div><p>รหัสนักศึกษา ${esc(game.student)} · ${esc(game.nickname)}</p><p class="muted">คะแนนนี้บันทึกในเบราว์เซอร์ของคุณ ยังไม่ได้ส่งให้อาจารย์${game.index<15?' ข้อประเมินที่ยังไม่ส่งได้ 0 คะแนน':''}</p><a class="button primary" href="${esc(E.forms(game))}" target="_blank" rel="noopener noreferrer">ส่งคะแนนให้อาจารย์ผ่าน Microsoft Forms ↗</a><p class="small muted">ฟอร์มจะกรอกข้อมูลล่วงหน้า ตรวจสอบและกดส่งใน Forms อีกครั้ง เว็บนี้ไม่สามารถตรวจสอบสถานะการส่งของ Forms ได้</p><h3>เฉลยภารกิจประเมิน</h3>${questions.filter(q=>q.phase==='ประเมิน').map(q=>{const a=game.answers.find(x=>x.id===q.id);return `<details class="review"><summary>${esc(q.title)} · ${a?.points||0}/2</summary><p>${esc(q.actions[q.correct[0]])}</p><p>${esc(q.reasons[q.correct[1]])}</p><p>${esc(q.why)}</p><p class="small muted">${esc(cards[q.card].law)}</p></details>`}).join('')}<hr><button id="reset">เริ่มรอบใหม่ / เปลี่ยนผู้เล่น</button><p class="small muted">เริ่มรอบใหม่จะล้างคะแนนในเบราว์เซอร์นี้ ส่ง Forms ให้เรียบร้อยก่อน</p></article>${sidebar()}</div></section>`;bindCards();bind('reset',()=>{if(!confirm('ล้างผลในเครื่องและเริ่มใหม่? โปรดส่งคะแนนผ่าน Forms ก่อน'))return;game=null;feedback=null;selected={};try{localStorage.removeItem(STORE)}catch(e){}start()});tick()}
function tick(){if(!game)return;const e=document.getElementById('timer');if(e){const sec=Math.max(0,Math.ceil((game.deadline-Date.now())/1000));e.textContent=game.done?'จบรอบแล้ว':`เหลือ ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;}if(!game.done&&E.expire(game)){save();render()}}
setInterval(tick,1000);render();

})();

</script><script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

try {





    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(60, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    document.getElementById('cosmos').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.03;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    const noiseChunk = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
            const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 = v - i + dot(i, C.xxx) ;
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }
    `;

    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const bhGeo = new THREE.SphereGeometry(4, 64, 64);
    coreGroup.add(new THREE.Mesh(bhGeo, bhMat));

    const auraMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 }, uIntensity: { value: 1.0 } },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vView = normalize(-(modelViewMatrix * vec4(position, 1.0)).xyz);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uIntensity;
            varying vec3 vNormal;
            varying vec3 vView;
            void main() {
                float rim = pow(1.0 - max(dot(vNormal, vView), 0.0), 4.0);
                gl_FragColor = vec4(vec3(1.0, 0.45, 0.1) * rim * uIntensity * 5.0, 1.0);
            }
        `,
        side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending
    });
    coreGroup.add(new THREE.Mesh(new THREE.SphereGeometry(4.25, 64, 64), auraMat));

    const instanceCount = window.innerWidth < 760 ? 1400 : 3500;
    const streakGeo = new THREE.CylinderGeometry(0.01, 0.12, 2.2, 3);
    streakGeo.rotateX(Math.PI / 2);
    
    const diskMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMorph: { value: 0.1 },
            uCompression: { value: 1.0 },
            uIntensity: { value: 1.0 },
            uOrbitScale: { value: 1.0 }
        },
        vertexShader: `
            ${noiseChunk}
            uniform float uTime;
            uniform float uMorph;
            uniform float uCompression;
            uniform float uIntensity;
            uniform float uOrbitScale;
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                vec4 instPos = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                float rOriginal = length(instPos.xz);
                float r = rOriginal * uCompression;
                float initialAngle = atan(instPos.z, instPos.x);
                float orbitalVelocity = (1.5 / sqrt(rOriginal)) * uOrbitScale;
                float currentAngle = initialAngle + (uTime * orbitalVelocity);
                vec3 morphedWorldPos = vec3(cos(currentAngle) * r, instPos.y, sin(currentAngle) * r);
                float noise = snoise(vec3(morphedWorldPos.x * 0.08, morphedWorldPos.z * 0.08, uTime * 0.3));
                morphedWorldPos.y += noise * uMorph * 4.0;
                vec3 viewDir = normalize(cameraPosition - morphedWorldPos);
                vec3 orbitDir = normalize(vec3(-sin(currentAngle), 0.0, cos(currentAngle)));
                float doppler = dot(orbitDir, viewDir);
                vec3 hot = vec3(1.0, 0.95, 0.9);
                vec3 warm = vec3(1.0, 0.45, 0.1);
                vec3 cool = vec3(0.1, 0.35, 1.0);
                vec3 color = mix(cool, warm, (1.0 - smoothstep(12.0, 45.0, r)));
                color = mix(color, hot, (1.0 - smoothstep(4.0, 10.0, r)));
                vColor = color * (1.3 + doppler * 0.7) * uIntensity;
                vOpacity = (smoothstep(3.8, 5.5, r) * (1.0 - smoothstep(38.0, 48.0, r))) * 0.8;
                float deltaAngle = currentAngle - initialAngle;
                float c = cos(deltaAngle);
                float s = sin(deltaAngle);
                mat3 rotY = mat3(
                    c, 0, s,
                    0, 1, 0,
                   -s, 0, c
                );
                vec3 localPos = (instanceMatrix * vec4(position, 0.0)).xyz;
                vec3 rotatedLocalPos = rotY * localPos;
                gl_Position = projectionMatrix * viewMatrix * vec4(morphedWorldPos + rotatedLocalPos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vColor;
            varying float vOpacity;
            void main() {
                gl_FragColor = vec4(vColor, vOpacity);
            }
        `,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });

    const instancedDisk = new THREE.InstancedMesh(streakGeo, diskMaterial, instanceCount);
    const dummy = new THREE.Object3D();

    for (let i = 0; i < instanceCount; i++) {
        const r = 5 + Math.pow(Math.random(), 1.3) * 40;
        const angle = Math.random() * Math.PI * 2;
        dummy.position.set(Math.cos(angle) * r, (Math.random() - 0.5) * (8 / r), Math.sin(angle) * r);
        dummy.lookAt(dummy.position.x + Math.sin(angle), dummy.position.y, dummy.position.z - Math.cos(angle));
        dummy.updateMatrix();
        instancedDisk.setMatrixAt(i, dummy.matrix);
    }
    scene.add(instancedDisk);

    const camControl = { distance: 85 };
    controls.enableZoom = false;
    controls.enabled = false;
    window.mediaMotionPaused = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        if (document.hidden || window.mediaMotionPaused) return;
        const time = clock.getElapsedTime();
        diskMaterial.uniforms.uTime.value = time;
        auraMat.uniforms.uTime.value = time;
        instancedDisk.rotation.y += 0.0005;
        const currentDir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
        camera.position.x = controls.target.x + currentDir.x * camControl.distance;
        camera.position.z = controls.target.z + currentDir.z * camControl.distance;
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();

} catch (e) { console.warn("Background unavailable; game continues."); }

</script></body></html>
